<!DOCTYPE html>
<html lang="it">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#ffffff">
        <title>Heartshopper</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&display=swap" rel="stylesheet">
        <style>
            :root {
                --viola: #5B2587;
                --ombra: #8E8A99;
                color-scheme: light;
                font-family: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif
            }

            * {
                box-sizing: border-box
            }

            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #fff
            }
            
            .stage {
                position: fixed;
                left: 50%;
                bottom: 0;
                transform: translateX(-50%);
                width: min(100vw, calc(100vh*9/16));
                width: min(100vw, calc(100dvh*9/16));
                aspect-ratio: 9/16;
                container-type: inline-size;
            }

            .stage img {
                display: block;
                width: 100%;
                height: 100%;
                user-select: none;
                -webkit-user-drag: none
            }

            /* Il bottone sta nello spazio vuoto tra il titolo e le foto */
            .btn {
                position: absolute;
                left: 50%;
                top: 32%;
                transform: translate(-50%, -50%);
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 11rem;
                min-height: 56px;
                padding: .7em 2.2em;
                font-size: 1.5rem;
                font-weight: 800;
                letter-spacing: .04em;
                text-transform: uppercase;
                color: #fff;
                background: var(--viola);
                text-decoration: none;
                border-radius: 999px;
                box-shadow: 0 .2em 0 var(--ombra);
                -webkit-tap-highlight-color: transparent;
            }

            @supports (width:1cqw) {
                .btn {
                    min-width: 0;
                    min-height: 0;
                    width: 58cqw;
                    padding: 3.6cqw 0;
                    font-size: 8cqw
                }
            }

            .btn:active {
                transform: translate(-50%, calc(-50% + .12em));
                box-shadow: 0 .08em 0 var(--ombra)
            }

            .btn:focus-visible {
                outline: 4px solid #14204D;
                outline-offset: 4px
            }

            @media (prefers-reduced-motion:reduce) {
                .btn {
                    transition: none
                }
            }
        </style>
    </head>

    <body>
        <main class="stage">
            <img src="img/sfondoSebi.jpeg" width="1080" height="1920" alt="Heartshopper">
            <a class="btn" href="game.html">Gioca</a>
        </main>
    </body>

</html>
